name: Release installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the installers (defaults to the pushed tag, or 1.0.0)
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          raw="${REQUESTED:-${GITHUB_REF_NAME}}"
          raw="${raw#v}"
          if [[ ! "$raw" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            raw="1.0.0"
          fi
          IFS='.' read -r major minor patch remainder <<< "$raw"
          version="${major}.${minor:-0}.${patch:-0}"
          echo "Resolved version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Run shared tests
        run: ./gradlew :shared:jvmTest

  windows:
    name: Windows MSI
    needs: [version, test]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build MSI
        run: ./gradlew.bat :desktopApp:packageMsi
      - uses: actions/upload-artifact@v4
        with:
          name: Verse-${{ needs.version.outputs.version }}-windows-x64
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  macOS:
    name: macOS DMG (${{ matrix.arch }})
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSE_VERSION: ${{ needs.version.outputs.version }}
      VERSE_MAC_SIGN_IDENTITY: ${{ secrets.VERSE_MAC_SIGN_IDENTITY }}
      VERSE_MAC_P12: ${{ secrets.VERSE_MAC_P12 }}
      VERSE_MAC_P12_PASSWORD: ${{ secrets.VERSE_MAC_P12_PASSWORD }}
      VERSE_APPLE_ID: ${{ secrets.VERSE_APPLE_ID }}
      VERSE_APPLE_PASSWORD: ${{ secrets.VERSE_APPLE_PASSWORD }}
      VERSE_APPLE_TEAM_ID: ${{ secrets.VERSE_APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Import signing certificate
        if: env.VERSE_MAC_P12 != ''
        env:
          P12: ${{ env.VERSE_MAC_P12 }}
          P12_PASSWORD: ${{ env.VERSE_MAC_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/verse-signing.keychain-db"
          printf '%s' "$P12" | tr -d '\r\n' | openssl base64 -d -A > "$RUNNER_TEMP/verse-signing.p12"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$RUNNER_TEMP/verse-signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain" > /dev/null
          security unlock-keychain -p "" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "VERSE_MAC_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build DMG
        run: ./gradlew :desktopApp:packageDmg
      - name: Notarize DMG
        if: env.VERSE_APPLE_ID != '' && env.VERSE_MAC_SIGN_IDENTITY != ''
        run: ./gradlew :desktopApp:notarizeDmg
      - uses: actions/upload-artifact@v4
        with:
          name: Verse-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, macOS]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
